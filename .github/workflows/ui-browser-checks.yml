name: UI browser checks

on:
  push:
    branches: [codex/ui-ux-improvements]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install isolated browser test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/day-by-day-browser" --no-save --package-lock=false playwright@1.62.1
          node "$RUNNER_TEMP/day-by-day-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Check standalone browser interactions and layout
        env:
          DAY_BY_DAY_PLAYWRIGHT_PATH: ${{ runner.temp }}/day-by-day-browser/node_modules/playwright
          DAY_BY_DAY_BROWSER_OUTPUT: ${{ runner.temp }}/day-by-day-browser-results
        run: npm run test:browser
      - name: Save browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-browser-screenshots
          path: ${{ runner.temp }}/day-by-day-browser-results
          if-no-files-found: ignore
