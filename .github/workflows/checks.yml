name: Checks

on:
  # Pull requests run these checks once. Pushes to main check the merged result.
  push:
    branches: [main, codex/neutral-violet-redesign]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
        with:
          # Later steps never push, so the token isn't left on disk for them.
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - name: Run tests
        run: npm test
      - name: Check the committed HTML and checksums match the source
        run: |
          node scripts/build.mjs
          git diff --exit-code -- Day-by-Day.html SHA256SUMS.txt
      - name: Verify checksums
        run: sha256sum -c SHA256SUMS.txt
      - name: Check release files can be prepared
        run: |
          node scripts/release-files.mjs
          (cd release && sha256sum -c SHA256SUMS.txt)
